<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Store - متجر الحسابات</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --accent-green: #238636;
      --accent-blue: #58a6ff;
      --badge-bg: #21262d;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #161b22;
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      color: #f0f6fc;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 svg {
      fill: #f0f6fc;
    }
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background-color: var(--badge-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    .filter-btn.active, .filter-btn:hover {
      background-color: var(--accent-blue);
      color: #000;
      border-color: var(--accent-blue);
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid var(--border-color);
    }
    .card-body {
      padding: 15px;
      flex-grow: 1;
    }
    .card-title {
      font-size: 18px;
      margin: 0 0 10px 0;
      color: #f0f6fc;
    }
    .card-desc {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 15px;
      white-space: pre-line;
    }
    .card-footer {
      padding: 15px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0d1117;
    }
    .price {
      font-weight: bold;
      color: #3fb950;
      font-size: 18px;
    }
    .buy-btn {
      background-color: var(--accent-green);
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
    }
    .buy-btn:hover {
      opacity: 0.9;
    }
    .badge {
      display: inline-block;
      background-color: var(--badge-bg);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 10px;
      color: var(--accent-blue);
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<header>
  <h1>
    <svg height="28" viewBox="0 0 16 16" width="28"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
    متجر الحسابات الرسمية
  </h1>
</header>

<div class="container">
  <div class="filters">
    <button class="filter-btn active" onclick="filterCategory('all', this)">الكل</button>
    <button class="filter-btn" onclick="filterCategory('coc', this)">كلاش اوف كلانس</button>
    <button class="filter-btn" onclick="filterCategory('pubg', this)">ببجي</button>
    <button class="filter-btn" onclick="filterCategory('usernames', this)">يوزرات المنصات</button>
  </div>

  <div class="grid" id="itemsGrid"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAD0T212nN6Q4af8uLHnXFcbwFYvF01ALI",
    authDomain: "cashmoney-5da29.firebaseapp.com",
    databaseURL: "https://cashmoney-5da29-default-rtdb.firebaseio.co",
    projectId: "cashmoney-5da29",
    storageBucket: "cashmoney-5da29.appspot.com",
    messagingSenderId: "500937410646",
    appId: "1:500937410646:android:75c75c3141e4422a0913f7"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allAccounts = [];
  let currentFilter = 'all';

  db.ref('accounts').on('value', (snapshot) => {
    const data = snapshot.val();
    allAccounts = [];
    if (data) {
      Object.keys(data).forEach(key => {
        allAccounts.push({ id: key, ...data[key] });
      });
    }
    renderAccounts();
  });

  function renderAccounts() {
    const grid = document.getElementById('itemsGrid');
    grid.innerHTML = '';

    const filtered = currentFilter === 'all' 
      ? allAccounts 
      : allAccounts.filter(acc => acc.category === currentFilter);

    if (filtered.length === 0) {
      grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #8b949e;">لا توجد حسابات متوفرة في هذا القسم حالياً.</p>';
      return;
    }

    filtered.forEach(item => {
      const categoryNames = {
        coc: 'كلاش اوف كلانس',
        pubg: 'ببجي',
        usernames: 'يوزر منصة'
      };

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${item.imageUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x180?text=No+Image'">
        <div class="card-body">
          <span class="badge">${categoryNames[item.category] || item.category}</span>
          <h3 class="card-title">${item.title}</h3>
          <div class="card-desc">${item.description || 'لا يوجد وصف إضافي.'}</div>
        </div>
        <div class="card-footer">
          <span class="price">${item.price}</span>
          <a href="${item.contactLink}" target="_blank" class="buy-btn">تواصل للشراء</a>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function filterCategory(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAccounts();
  }
</script>

</body>
</html>
