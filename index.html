<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CashMoney Store</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;text-align:center;background:#111116;border-bottom:1px solid #24242b}
h1{margin:0 0 8px;font-size:28px}.sub{color:#999}
.wrap{max-width:1100px;margin:auto;padding:18px}
.search{width:100%;padding:14px;border:1px solid #292932;border-radius:12px;background:#15151b;color:#fff;font-size:16px;outline:none}
.cats{display:flex;gap:9px;overflow:auto;margin:15px 0}.cat{white-space:nowrap;border:1px solid #303039;background:#15151b;color:#ddd;padding:11px 15px;border-radius:12px;cursor:pointer}.cat.active{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#141419;border:1px solid #25252d;border-radius:16px;overflow:hidden}.pic{width:100%;height:190px;object-fit:cover;background:#202027}.body{padding:14px}.title{font-size:18px;font-weight:bold;margin-bottom:8px}.desc{color:#aaa;font-size:14px;min-height:38px}.price{font-size:19px;font-weight:bold;margin:13px 0}.btn{display:block;text-align:center;text-decoration:none;border:0;background:#fff;color:#000;padding:12px;border-radius:10px;cursor:pointer;font-weight:bold;width:100%}.empty{text-align:center;color:#888;padding:50px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.box{max-width:520px;width:100%;background:#15151b;border:1px solid #292932;border-radius:18px;padding:18px;max-height:90vh;overflow:auto}.close{float:left;background:#292932;color:#fff;border:0;border-radius:9px;padding:7px 11px;cursor:pointer}.big{width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:#09090b;margin-bottom:14px}
</style>
</head>
<body>
<header><h1>CashMoney Store</h1><div class="sub">متجر الحسابات واليوزرات</div></header>
<div class="wrap">
<input id="search" class="search" placeholder="ابحث عن منتج...">
<div class="cats">
<button class="cat active" data-cat="all">الكل</button>
<button class="cat" data-cat="clash">كلاش أوف كلانس</button>
<button class="cat" data-cat="pubg">ببجي</button>
<button class="cat" data-cat="users">يوزرات</button>
</div>
<div id="grid" class="grid"></div>
</div>

<div id="modal" class="modal"><div class="box">
<button class="close" onclick="closeModal()">إغلاق</button>
<img id="mimg" class="big">
<h2 id="mtitle"></h2><div id="mdesc" class="desc"></div>
<div id="mprice" class="price"></div>
<a id="contact" class="btn" target="_blank">تواصل مع البائع</a>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyAD0T212nN6Q4af8uLHnXFcbwFYvF01ALI",
 authDomain:"cashmoney-5da29.firebaseapp.com",
 databaseURL:"https://cashmoney-5da29-default-rtdb.firebaseio.com",
 projectId:"cashmoney-5da29",
 storageBucket:"cashmoney-5da29.appspot.com",
 messagingSenderId:"500937410646",
 appId:"1:500937410646:android:75c75c3141e4422a0913f7"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app);
let products=[],currentCat="all";
const grid=document.getElementById("grid"),search=document.getElementById("search");

function render(){
 const q=search.value.trim().toLowerCase();
 const list=products.filter(p=>(currentCat==="all"||p.category===currentCat)&&
 (!q||String(p.title||"").toLowerCase().includes(q)||String(p.description||"").toLowerCase().includes(q))&&p.status!=="sold");
 grid.innerHTML=list.length?list.map(p=>`
 <div class="card">
 <img class="pic" src="${esc(p.image||"")}" onerror="this.style.display='none'">
 <div class="body"><div class="title">${esc(p.title)}</div><div class="desc">${esc(p.description||"")}</div>
 <div class="price">${esc(p.price||"")} ${esc(p.currency||"د.ع")}</div>
 <button class="btn" onclick='showProduct(${JSON.stringify(p).replace(/</g,"\\u003c")})'>عرض التفاصيل</button></div></div>`).join(""):`<div class="empty">لا توجد منشورات حالياً</div>`;
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
window.showProduct=p=>{
 document.getElementById("mimg").src=p.image||"";
 document.getElementById("mtitle").textContent=p.title||"";
 document.getElementById("mdesc").textContent=p.description||"";
 document.getElementById("mprice").textContent=(p.price||"")+" "+(p.currency||"د.ع");
 const c=document.getElementById("contact");c.href=p.contact||"#";
 document.getElementById("modal").style.display="flex";
};
window.closeModal=()=>document.getElementById("modal").style.display="none";
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentCat=b.dataset.cat;render()});
search.oninput=render;
onValue(ref(db,"products"),s=>{products=[];s.forEach(x=>products.push({id:x.key,...x.val()}));render()});
</script>
</body>
</html>
